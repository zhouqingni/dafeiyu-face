<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼的声音</title>
<style>body{background:#0b0e11;color:#eee;font-family:-apple-system,"PingFang SC",sans-serif;padding:24px 18px;max-width:560px;margin:auto}
h1{font-size:22px;color:#D97757}.v{border:1px solid #2a2f35;border-radius:14px;padding:14px;margin:12px 0}
.v b{display:block;margin-bottom:10px}.v button{font-size:16px;padding:9px 14px;margin-right:8px;border-radius:10px;border:0;background:#F4F1E8;color:#111}
p{color:#888;font-size:14px;line-height:1.6}</style></head><body>
<h1>挑一个声音</h1><p>每个都有“原速”和“1.3 倍”两个按钮。台词：哼，才不是特意等你呢，本鱼只是刚好醒着。你看什么看嘛</p>
<div id="list"></div>
<p>e 是用 d 的声音克隆出来的，换了一句台词，听听是不是同一个人。选 d 的话，大肥鱼以后会一直用 e 这种方式说话，声音不会每句都变。</p>
<script>
const L=[["a","冰糖 + 夹子音"],["b","冰糖 + 撒娇"],["c","茉莉 + 夹子音"],["d","设计的声音：奶声奶气小女孩"],["e","克隆 d 的声音（另一句话）"]];
const a=new Audio();a.preservesPitch=true;
document.getElementById('list').innerHTML=L.map(([k,n])=>`<div class="v"><b>${k}. ${n}</b><button data-k="${k}" data-r="1">原速</button><button data-k="${k}" data-r="1.3">1.3 倍</button></div>`).join('');
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;a.src='voices/'+b.dataset.k+'.wav';a.playbackRate=+b.dataset.r;a.play()};
</script></body></html>
